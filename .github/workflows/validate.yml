name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Validate 動詞の活用2 data
        run: npm run test:katsuyou2

      - name: Validate evidence before examples
        run: npm run test:form-verification

      - name: Test 活用2 feedback and reviewed batches
        run: npm run test:katsuyou2-ui

      - name: Audit example content
        run: npm run audit:content

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check conjugation-core.js
          node --check katsuyou2.js
          node --check katsuyou2-review.js
          node --check scripts/audit-content.mjs
          node --check scripts/content-review.mjs
          node --check scripts/import-verbs.mjs
          node --check scripts/import-katsuyou2.mjs
          node --check scripts/validate-katsuyou2.mjs
          node --check scripts/validate-form-verification.mjs
          node --check scripts/test-katsuyou2-ui.mjs

      - name: Check required pages
        run: |
          test -f index.html
          test -f conjugation-core.js
          test -f katsuyou2.html
          test -f katsuyou2-review.html
          test -f styles.css
          test -f katsuyou2.css
